name: Release DmxUtilities

# Turns the annotated tag pushed by the release of dmx_utils (with the deploy
# key of this repo, which cannot call the Releases API) into a GitHub Release
# carrying the archive. First line of the tag message: title; the rest: notes.
# A version with a suffix (1.10.0-rc.1) is a pre-release, never "Latest".
on:
  push:
    tags: ["dmx-utilities-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à (re)publier, par exemple dmx-utilities-v1.10.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Page Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG existe déjà."
            exit 0
          fi
          version="${TAG#dmx-utilities-v}"
          archive="dmx-utilities/releases/DmxUtilities-$version.zip"
          if [ ! -f "$archive" ]; then
            echo "::error::$archive est absent du tag."
            exit 1
          fi
          # The annotated tag object carries the title and the notes.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          message="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
          title="$(printf '%s\n' "$message" | head -n 1)"
          printf '%s\n' "$message" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          kind=()
          case "$version" in *-*) kind=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${title:-DmxUtilities $version}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${kind[@]}"
